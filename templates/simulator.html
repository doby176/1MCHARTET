<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Simulator - 1MChart</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link rel="stylesheet" href="/static/styles.css?v=41">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        #chart-container { width: 100%; height: 600px; }
        #replay-controls { margin: 10px 0; }
        #replay-controls button, #replay-controls select, #replay-controls input { margin-right: 10px; }
        #timestamp { font-weight: bold; }
        .form-container { margin-bottom: 20px; }
        .error-message { color: red; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; }
        .logo { height: 50px; }
        .user-info a { color: #007bff; text-decoration: none; }
        .user-info a:hover { text-decoration: underline; }
        
        /* Trading button styles */
        .trading-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            margin-right: 10px;
        }
        
        #long-position {
            background-color: #00cc00;
            color: white;
        }
        
        #long-position:hover {
            background-color: #00aa00;
        }
        
        #short-position {
            background-color: #ff0000;
            color: white;
        }
        
        #short-position:hover {
            background-color: #dd0000;
        }
        
        #long-position.active {
            background-color: #00aa00;
            box-shadow: 0 0 10px rgba(0, 204, 0, 0.5);
        }
        
        #short-position.active {
            background-color: #dd0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        
        /* Mobile styles */
        @media (max-width: 600px) {
            #replay-controls {
                display: flex;
                flex-direction: column;
                gap: 8px;
                align-items: center;
            }
            
            #replay-controls button, #replay-controls select, #replay-controls input {
                margin-right: 0;
                margin-bottom: 5px;
                width: 100%;
                max-width: 200px;
            }
            
            .trading-btn {
                font-size: 0.9em;
                padding: 10px 20px;
            }
            
            #timestamp {
                font-size: 0.9em;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="/static/logo-new.png?v=2" alt="1MChart Logo" class="logo">
        <div class="user-info">
            <p>Welcome, <span id="username">{{ session.username | default('Guest') }}</span> | <a href="/logout">Log Out</a> | <a href="/dashboard">Back to Dashboard</a></p>
        </div>
    </header>
    <main>
        <div class="card">
            <h2>Market Simulator</h2>
            <p>Simulate trading with historical Nasdaq data using candlestick charts and interactive replay controls.</p>
            <div class="form-container">
                <form id="chart-form">
                    <label for="ticker-select">Select Ticker:</label>
                    <select id="ticker-select">
                        <option value="">Select Ticker</option>
                    </select>
                    <label for="date">Select Date:</label>
                    <input type="date" id="date">
                    <label for="timeframe-select">Select Timeframe (minutes):</label>
                    <select id="timeframe-select">
                        <option value="1">1 Minute</option>
                        <option value="2">2 Minutes</option>
                        <option value="3">3 Minutes</option>
                        <option value="5">5 Minutes</option>
                        <option value="10">10 Minutes</option>
                    </select>
                    <button type="submit">Load Chart</button>
                </form>
                <p id="error-message" class="error-message"></p>
            </div>
            <div id="chart-container"></div>
            <div id="replay-controls" style="display: none;">
                <button id="play-replay">Play Replay</button>
                <button id="pause-replay" disabled>Pause Replay</button>
                <button id="long-position" class="trading-btn">Long</button>
                <button id="short-position" class="trading-btn">Short</button>
                <button id="start-over-replay" disabled>Start Over</button>
                <button id="prev-candle" disabled>Previous</button>
                <button id="next-candle" disabled>Next</button>
                <label for="replay-speed">Speed (ms):</label>
                <select id="replay-speed">
                    <option value="1000">1x (1 sec/bar)</option>
                    <option value="500">2x (0.5 sec/bar)</option>
                    <option value="250">4x (0.25 sec/bar)</option>
                </select>
                <label for="replay-start-time">Start Time (HH:MM):</label>
                <input type="text" id="replay-start-time" placeholder="09:30" pattern="[0-2][0-9]:[0-5][0-9]">
                <span id="timestamp">Current Time: --:--:--</span>
            </div>
            <img src="/static/logo-new.png" alt="1MChart Section Logo" class="section-logo">
        </div>
    </main>
    <script src="/static/simulator.js"></script>
</body>
</html>
